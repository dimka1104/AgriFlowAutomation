<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - AgriFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <main class="container">
    <h1>Dashboard</h1>
    <p id="welcome" class="subtitle">Loading...</p>
    <div id="master-panel" hidden>
      <section class="card">
        <h2>Master tools</h2>
        <a href="/admin" class="btn btn-link">Manage Users</a>
      </section>
    </div>
  </main>
  <script src="/app.js"></script>
  <script>
    (async () => {
      const user = await requireUser();
      if (!user) return;

      const response = await apiFetch("/api/dashboard");
      const data = await response.json();
      document.getElementById("welcome").textContent = data.message;

      if (user.role === "master") {
        document.getElementById("master-panel").hidden = false;
      }
    })();
  </script>
</body>
</html>
